<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BBTS LIVE HUB</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg:#07080b; --fg:#f5f5f2; --muted:#a8a8ad; --line:rgba(255,255,255,.18);
      --glass:rgba(13,15,22,.64); --hot:#ff315f; --cold:#8aa7ff;
      --shadow:0 22px 70px rgba(0,0,0,.48);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{overflow-x:hidden}
    button,a{font:inherit}
    .app{min-height:100svh;position:relative;isolation:isolate;background:radial-gradient(circle at 50% 18%,rgba(70,80,110,.10),transparent 38%),linear-gradient(180deg,#090a0d 0%,#050608 100%)}
    .app:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
      background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 4px)}
    header{height:84px;padding:0 clamp(18px,4vw,56px);display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}
    .brand{display:flex;gap:12px;align-items:center;min-width:0}
    .brand-logo{display:block;width:clamp(116px,14vw,205px);height:52px;object-fit:contain;object-position:left center;filter:drop-shadow(0 0 10px rgba(255,255,255,.10))}
    .live-title{font-family:Georgia,serif;font-weight:500;letter-spacing:.24em;font-size:clamp(30px,4.8vw,62px);margin:10px 0 8px;line-height:1}
    nav{display:flex;gap:24px;color:#d8d8da;font-size:12px;letter-spacing:.22em}
    nav b{color:white;position:relative}
    nav b:after{content:"";height:1px;background:var(--hot);position:absolute;left:0;right:0;bottom:-10px;box-shadow:0 0 12px var(--hot)}
    .hero{padding:28px clamp(18px,4vw,56px) 28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
    .eyebrow{font-size:11px;letter-spacing:.34em;color:#b8bbc4}
    .hero p{margin:0;color:var(--muted);font-size:13px;letter-spacing:.14em}
    .countdown{text-align:right;border-left:1px solid var(--line);padding-left:24px}
    .countdown strong{display:block;font-size:clamp(26px,4vw,52px);font-weight:500;letter-spacing:.05em}
    .countdown span{font-size:10px;letter-spacing:.28em;color:#b6b8bf}
    .toolbar{padding:0 clamp(18px,4vw,56px) 18px;display:flex;justify-content:space-between;align-items:center;gap:16px}
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;background:rgba(0,0,0,.32);backdrop-filter:blur(10px)}
    .seg button{border:0;background:transparent;color:#b9bbc2;padding:9px 22px;border-radius:999px;cursor:pointer;font-size:11px;letter-spacing:.2em}
    .seg button.active{color:white;background:rgba(255,49,95,.17);box-shadow:inset 0 0 0 1px rgba(255,49,95,.6),0 0 24px rgba(255,49,95,.25)}
    .hint{font-size:10px;letter-spacing:.2em;color:#93959d}
    main{padding:0 clamp(18px,4vw,56px) 72px}
    #floatView{position:relative;min-height:690px;max-width:1400px;margin:0 auto}
    .card{position:absolute;width:min(320px,76vw);min-height:188px;border:1px solid rgba(255,255,255,.23);
      background:linear-gradient(145deg,rgba(21,23,31,.82),rgba(8,9,13,.66));backdrop-filter:blur(16px);
      box-shadow:var(--shadow);padding:20px 20px 18px;cursor:pointer;overflow:hidden;transition:.28s ease;
      clip-path:polygon(2% 0,98% 1%,100% 92%,96% 100%,3% 98%,0 8%);animation:floaty 7s ease-in-out infinite alternate}
    .card:before{content:"";position:absolute;inset:-30%;background:linear-gradient(120deg,transparent 38%,rgba(255,255,255,.11),transparent 62%);transform:translateX(-50%) rotate(8deg);transition:.5s}
    .card:hover{transform:translateY(-8px) scale(1.035) rotate(0deg)!important;z-index:20;border-color:rgba(255,255,255,.58)}
    .card:hover:before{transform:translateX(54%) rotate(8deg)}
    .card.hot{box-shadow:var(--shadow),0 0 34px rgba(255,49,95,.19)}
    .card .top{display:flex;justify-content:space-between;color:#c3c5cc;font-size:10px;letter-spacing:.18em}
    .date{font-family:Georgia,serif;font-size:52px;line-height:1;margin:11px 0 4px;letter-spacing:.02em}
    .city{font-family:Georgia,serif;font-size:26px;letter-spacing:.08em}
    .event-title{margin-top:7px;color:#f0afbe;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
    .venue{margin-top:16px;color:#c7c8ce;font-size:12px;letter-spacing:.12em;border-top:1px solid rgba(255,255,255,.13);padding-top:11px}
    .tag{border:1px solid rgba(255,255,255,.22);padding:4px 7px;border-radius:99px;font-size:9px}
    @keyframes floaty{from{translate:0 -5px}to{translate:0 12px}}
    .c0{left:2%;top:48px;rotate:-4deg;animation-delay:-1s} .c1{right:5%;top:10px;rotate:4deg;animation-delay:-3s}
    .c2{left:36%;top:236px;rotate:1deg;animation-delay:-5s} .c3{left:5%;top:390px;rotate:3deg;animation-delay:-2s}
    .c4{right:28%;top:420px;rotate:-3deg;animation-delay:-4s} .c5{right:2%;top:308px;rotate:5deg;animation-delay:-6s}
    #listView{display:none;max-width:1040px;margin:0 auto;border-top:1px solid var(--line)}
    .row{display:grid;grid-template-columns:120px 1fr auto;gap:18px;padding:22px 4px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;transition:.2s}
    .row:hover{padding-left:14px;background:rgba(255,255,255,.025)}
    .row-date{font-family:Georgia,serif;font-size:24px}
    .row h3{margin:0 0 5px;font-size:16px;letter-spacing:.08em;font-weight:600}
    .row p{margin:0;color:var(--muted);font-size:12px}
    .arrow{font-size:22px;color:#a8aab2}
    footer{padding:20px clamp(18px,4vw,56px) 34px;color:#777b85;font-size:10px;letter-spacing:.18em;display:flex;justify-content:space-between}
    dialog{border:1px solid rgba(255,255,255,.18);background:rgba(7,8,12,.88);color:white;max-width:620px;width:calc(100% - 30px);
      padding:0;box-shadow:0 40px 120px rgba(0,0,0,.68);backdrop-filter:blur(22px)}
    dialog::backdrop{background:rgba(0,0,0,.64);backdrop-filter:blur(5px)}
    .modal{padding:26px} .modal-head{display:flex;justify-content:space-between;gap:20px}
    .modal small{letter-spacing:.24em;color:#a5a8b2} .modal h2{font-family:Georgia,serif;font-size:36px;margin:8px 0 0}
    .close{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:none;color:white;cursor:pointer}
    .meta{margin:24px 0;color:#c8cad1;line-height:1.8} .meta b{color:white}
    .ticket{display:flex;justify-content:center;text-decoration:none;color:white;border:1px solid rgba(255,49,95,.55);padding:13px;border-radius:3px;
      letter-spacing:.19em;font-size:11px;background:rgba(255,49,95,.13)}
    .ticket.disabled{opacity:.45;pointer-events:none}
    .install{border:1px solid var(--line);background:rgba(255,255,255,.04);color:white;padding:9px 13px;border-radius:4px;cursor:pointer;display:none}
    @media(max-width:800px){
      header{height:68px} .brand-logo{width:132px;height:44px} nav{display:none} .hero{grid-template-columns:1fr;padding-top:28px} .countdown{text-align:left;border-left:0;border-top:1px solid var(--line);padding:14px 0 0}
      .hint{display:none} #floatView{min-height:1040px} .card{width:72vw;min-height:175px}
      .c0{left:1%;top:10px} .c1{right:0;top:178px} .c2{left:5%;top:350px} .c3{right:2%;left:auto;top:520px}
      .c4{left:1%;right:auto;top:690px} .c5{right:0;top:860px}
      .row{grid-template-columns:90px 1fr 20px} .row-date{font-size:19px} footer{display:block;line-height:2}
    }
    @media(prefers-reduced-motion:reduce){.card{animation:none!important;transition:none}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img class="brand-logo" src="assets/bbts-logo.png" alt="Broken By The Scream"></div>
    <nav><span>HOME</span><span>NEWS</span><b>LIVE</b><span>MUSIC</span><span>VIDEO</span></nav>
    <button id="installBtn" class="install">INSTALL</button>
  </header>

  <section class="hero">
    <div>
      <div class="eyebrow">OFFICIAL LIVE INDEX</div>
<h1 class="live-title">LIVE SCHEDULE</h1>
      
    </div>
    <div class="countdown">
      <span>NEXT LIVE</span>
      <strong id="countdown">—</strong>
      <span id="nextLabel">LOADING</span>
    </div>
  </section>

  <div class="toolbar">
    <div class="seg">
      <button id="floatBtn" class="active">FLOAT</button>
      <button id="listBtn">LIST</button>
    </div>
    <div class="hint">CLICK A CARD TO OPEN LIVE DETAILS</div>
  </div>

  <main>
    <section id="floatView" aria-label="Floating live schedule"></section>
    <section id="listView" aria-label="List live schedule"></section>
  </main>

  <footer>
    <span>SCREAM BEYOND BORDERS.</span>
    <span>PROTOTYPE / BBTS LIVE HUB</span>
  </footer>
</div>

<dialog id="detailDialog">
  <div class="modal">
    <div class="modal-head">
      <div><small id="mType"></small><h2 id="mTitle"></h2></div>
      <button class="close" id="closeBtn">×</button>
    </div>
    <div class="meta" id="mMeta"></div>
    <a class="ticket" id="mTicket" href="#" target="_blank" rel="noopener">OPEN LIVE / TICKET PAGE</a>
  </div>
</dialog>

<script>
let events = [];

const floatView = document.getElementById('floatView');
const listView = document.getElementById('listView');
const dialog = document.getElementById('detailDialog');

function openEvent(e){
  document.getElementById('mType').textContent = [e.type, e.status, e.country].filter(Boolean).join(' / ');
  document.getElementById('mTitle').textContent = `${e.display} ${e.city}`;
  document.getElementById('mMeta').innerHTML =
    `<b>${e.title}</b><br>${e.venue}<br>${e.detail}`;
  const a = document.getElementById('mTicket');
  a.href = e.ticket || '#';
  a.classList.toggle('disabled', !e.ticket || e.ticket === '#');
  a.textContent = (!e.ticket || e.ticket === '#') ? 'TICKET INFO COMING SOON' : 'OPEN LIVE / TICKET PAGE';
  dialog.showModal();
}


function renderEvents(){
  floatView.innerHTML = '';
  listView.innerHTML = '';

  events.forEach((e,i)=>{
    const c = document.createElement('article');
    c.className = `card c${i} ${i===0?'hot':''}`;
    c.innerHTML = `<div class="top"><span>${e.date.slice(0,4)} / ${e.dow}</span><span class="tag">${e.status || e.type}</span></div>
      <div class="date">${e.display}</div><div class="city">${e.city}</div>
      <div class="event-title">${e.title}</div><div class="venue">${e.venue}</div>`;
    c.onclick = ()=>openEvent(e);
    floatView.appendChild(c);

    const r = document.createElement('article');
    r.className='row';
    r.innerHTML=`<div class="row-date">${e.display}</div><div><h3>${e.city} / ${e.title}</h3><p>${e.venue} — ${e.detail}</p></div><div class="arrow">↗</div>`;
    r.onclick=()=>openEvent(e);
    listView.appendChild(r);
  });
}

function switchView(mode){
  const isFloat = mode==='float';
  floatView.style.display=isFloat?'block':'none';
  listView.style.display=isFloat?'none':'block';
  document.getElementById('floatBtn').classList.toggle('active',isFloat);
  document.getElementById('listBtn').classList.toggle('active',!isFloat);
}
document.getElementById('floatBtn').onclick=()=>switchView('float');
document.getElementById('listBtn').onclick=()=>switchView('list');
document.getElementById('closeBtn').onclick=()=>dialog.close();
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});

function updateCountdown(){
  const now = new Date();
  const upcoming = events
    .map(e=>({...e,dt:new Date(e.date+'T00:00:00+09:00')}))
    .filter(e=>e.dt>=now)
    .sort((a,b)=>a.dt-b.dt)[0];

  if(!upcoming){
    document.getElementById('countdown').textContent='SEE YOU';
    document.getElementById('nextLabel').textContent='AT THE NEXT STAGE';
    return;
  }

  const days=Math.ceil((upcoming.dt-now)/86400000);
  document.getElementById('countdown').textContent = days===0?'TODAY':`${days} DAYS`;
  document.getElementById('nextLabel').textContent = `${upcoming.display} / ${upcoming.city}`;
}

async function loadEvents(){
  try{
    const res = await fetch(`events.json?v=${Date.now()}`, {cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    events = await res.json();
    renderEvents();
    updateCountdown();
  }catch(err){
    console.error('Failed to load events.json', err);
    document.getElementById('nextLabel').textContent='SCHEDULE LOAD ERROR';
  }
}

loadEvents();
setInterval(updateCountdown,60000);

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block'});
document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null};
</script>
</body>
</html>

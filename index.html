<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BBTS LIVE HUB</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#050608;--fg:#f7f7f5;--muted:#a6a7ad;--line:rgba(255,255,255,.14);--hot:#ff315f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden}
a,button{font:inherit}.app{min-height:100svh;position:relative;isolation:isolate}
.bg{position:fixed;inset:0;z-index:-3;background:
linear-gradient(180deg,rgba(0,0,0,.66),rgba(5,6,8,.84) 45%,#050608 88%),
linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.10),rgba(0,0,0,.46)),
url("assets/summer-breeze-bg.jpg") center 38%/cover no-repeat}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(120,135,180,.12),transparent 40%)}
header{height:76px;padding:0 clamp(18px,4vw,56px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(5,6,8,.58);backdrop-filter:blur(14px)}
.brand-logo{display:block;width:clamp(120px,14vw,190px);height:46px;object-fit:contain;object-position:left center}
nav{display:flex;gap:22px;font-size:11px;letter-spacing:.18em;color:#c5c6cb}nav a{color:inherit;text-decoration:none}nav a:hover{color:#fff}
.hero{min-height:68svh;padding:clamp(70px,10vw,130px) clamp(18px,5vw,70px) 52px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:30px}
.kicker{font-size:11px;letter-spacing:.34em;color:#c6c8cf}
h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(48px,8vw,105px);letter-spacing:.12em;line-height:.88;margin:14px 0 0}
.next-box{min-width:250px;text-align:right;border-left:1px solid var(--line);padding-left:26px;cursor:pointer;transition:.22s ease}.next-box:hover{transform:translateY(-3px);opacity:.92}.next-box span{display:block;font-size:10px;letter-spacing:.28em;color:#b6b8bf}.next-box strong{display:block;font-size:clamp(32px,5vw,62px);font-weight:500;margin:7px 0 4px}
section{padding:68px clamp(18px,5vw,70px)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}.section-head h2{font-family:Georgia,serif;font-size:clamp(30px,4vw,50px);font-weight:500;letter-spacing:.12em;margin:0}.section-head p{margin:0;color:var(--muted);font-size:12px;letter-spacing:.12em}.rule{height:1px;background:var(--line);margin-top:18px}
.pickup-grid{display:grid;grid-template-columns:1.35fr .85fr .85fr;gap:20px;align-items:stretch}
.pick-card{min-height:270px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.19);background:linear-gradient(145deg,rgba(22,24,31,.80),rgba(8,9,13,.72));backdrop-filter:blur(16px);padding:24px;cursor:pointer;clip-path:polygon(1.3% 0,99% .7%,100% 94%,97% 100%,2% 99%,0 6%);transition:.28s ease;box-shadow:0 24px 70px rgba(0,0,0,.38)}
.pick-card:hover{transform:translateY(-8px);border-color:rgba(255,255,255,.48)}.pick-card.primary{min-height:360px}.pick-card .label{font-size:10px;letter-spacing:.2em;color:#d5d6dc}.pick-card .status{float:right;border:1px solid rgba(255,255,255,.22);padding:4px 8px;border-radius:99px}.pick-card .date{font-family:Georgia,serif;font-size:clamp(46px,6vw,80px);line-height:1;margin:28px 0 8px}.pick-card .city{font-family:Georgia,serif;font-size:clamp(24px,3vw,38px);letter-spacing:.08em}.pick-card .title{margin-top:12px;color:#f3a7b9;font-size:12px;letter-spacing:.15em}.pick-card .venue{position:absolute;left:24px;right:24px;bottom:22px;border-top:1px solid rgba(255,255,255,.13);padding-top:12px;color:#d0d1d6;font-size:12px}
.oneman-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.one-card{position:relative;min-height:220px;border:1px solid var(--line);background:rgba(8,9,13,.60);backdrop-filter:blur(12px);padding:22px;cursor:pointer;transition:.24s ease;overflow:hidden}
.one-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.42)}
.one-card .od{font-family:Georgia,serif;font-size:42px;line-height:1;margin-bottom:8px}
.one-card .oc{font-size:16px;letter-spacing:.16em;margin-bottom:8px}
.one-card .ot{font-size:11px;color:#f3a7b9;letter-spacing:.12em;line-height:1.5}
.one-card .ov{position:absolute;left:22px;right:22px;bottom:20px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:var(--muted)}
.one-card .special{position:absolute;top:18px;right:18px;border:1px solid rgba(255,49,95,.65);background:rgba(255,49,95,.12);padding:5px 8px;border-radius:99px;font-size:9px;letter-spacing:.15em}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.filters button{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#c5c6cb;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:10px;letter-spacing:.13em}.filters button.active{color:#fff;border-color:rgba(255,49,95,.65);background:rgba(255,49,95,.10)}
.schedule{border-top:1px solid var(--line)}.schedule-row{display:grid;grid-template-columns:110px 130px minmax(0,1fr) 150px 28px;gap:18px;align-items:center;padding:19px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.2s ease}.schedule-row:hover{padding-left:12px;background:rgba(255,255,255,.025)}.sd{font-family:Georgia,serif;font-size:23px}.smeta{font-size:10px;color:#aeb0b8;letter-spacing:.15em}.smain h3{margin:0 0 4px;font-size:14px;letter-spacing:.07em}.smain p{margin:0;color:var(--muted);font-size:11px}.stag{justify-self:start;font-size:9px;letter-spacing:.14em;border:1px solid var(--line);border-radius:99px;padding:5px 8px}.arrow{font-size:20px;color:#9ea0a8}.past-empty{color:#777b84;font-size:12px;letter-spacing:.12em;padding:18px 0}
dialog{border:1px solid rgba(255,255,255,.18);background:rgba(7,8,12,.92);color:#fff;max-width:640px;width:calc(100% - 30px);padding:0;box-shadow:0 40px 120px rgba(0,0,0,.68);backdrop-filter:blur(22px)}dialog::backdrop{background:rgba(0,0,0,.67);backdrop-filter:blur(5px)}.modal{padding:28px}.modal-head{display:flex;justify-content:space-between;gap:20px}.modal small{letter-spacing:.22em;color:#a5a8b2}.modal h2{font-family:Georgia,serif;font-size:36px;margin:8px 0 0}.close{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:none;color:#fff;cursor:pointer}.meta{margin:24px 0;color:#c8cad1;line-height:1.8}.meta b{color:#fff}.ticket-stack{display:grid;gap:10px;margin-top:8px}.ticket{display:flex;justify-content:center;text-decoration:none;color:#fff;border:1px solid rgba(255,49,95,.55);padding:13px;border-radius:3px;letter-spacing:.18em;font-size:11px;background:rgba(255,49,95,.13)}.ticket.secondary{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.05)}.ticket.vip{border-color:rgba(255,200,90,.55);background:rgba(255,200,90,.08)}.ticket.disabled{opacity:.45;pointer-events:none}
footer{padding:26px clamp(18px,5vw,70px) 38px;color:#777b84;font-size:10px;letter-spacing:.16em;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between}
@media(max-width:950px){.hero{grid-template-columns:1fr;min-height:58svh}.next-box{text-align:left;border-left:0;border-top:1px solid var(--line);padding:18px 0 0}.pickup-grid{grid-template-columns:1fr 1fr}.pick-card.primary{grid-column:1/-1}.schedule-row{grid-template-columns:90px 100px 1fr 24px}.stag{display:none}.oneman-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){header{height:68px}nav{display:none}.brand-logo{width:132px;height:42px}.hero{padding-top:90px}.pickup-grid{grid-template-columns:1fr}.pick-card.primary{grid-column:auto;min-height:300px}.oneman-grid{grid-template-columns:1fr}.schedule-row{grid-template-columns:76px 1fr 22px;gap:12px}.smeta{display:none}.smain h3{font-size:13px}.section-head{align-items:start;flex-direction:column}footer{display:block;line-height:2}}
</style>
</head>
<body>
<div class="app"><div class="bg"></div>
<header><img class="brand-logo" src="assets/bbts-logo.png" alt="Broken By The Scream"><nav><a href="#schedule">SCHEDULE</a><a href="#oneman">ONE MAN</a><a href="#past">PAST</a></nav></header>
<section class="hero"><div><div class="kicker">BROKEN BY THE SCREAM / OFFICIAL LIVE INDEX</div><h1>LIVE<br>SCHEDULE</h1></div><div class="next-box" id="nextBox" role="button" tabindex="0" aria-label="Open next live details"><span>NEXT LIVE</span><strong id="nextCountdown">—</strong><span id="nextLabel">LOADING</span></div></section>
<section id="schedule"><div class="section-head"><div><h2>ALL SCHEDULE</h2><div class="rule"></div></div><p>ALL UPCOMING SHOWS</p></div><div class="filters" id="filters"><button class="active" data-filter="ALL">ALL</button><button data-filter="ONE MAN">ONE MAN</button><button data-filter="OVERSEAS">OVERSEAS</button><button data-filter="FESTIVAL">FESTIVAL</button><button data-filter="FC EVENT">FC</button></div><div class="schedule" id="scheduleList"></div></section>
<section id="oneman">
  <div class="section-head">
    <div><h2>ONE MAN</h2><div class="rule"></div></div>
    <p>FEATURED SOLO SHOWS</p>
  </div>
  <div class="oneman-grid" id="oneManGrid"></div>
</section>


<section id="past"><div class="section-head"><div><h2>PAST SHOWS</h2><div class="rule"></div></div><p>ARCHIVE</p></div><div class="schedule" id="pastList"></div></section>
<footer><span>SCREAM BEYOND BORDERS.</span><span>BBTS LIVE HUB</span></footer></div>
<dialog id="detailDialog"><div class="modal"><div class="modal-head"><div><small id="mType"></small><h2 id="mTitle"></h2></div><button class="close" id="closeBtn">×</button></div><div class="meta" id="mMeta"></div><div class="ticket-stack" id="ticketButtons"></div></div></dialog>
<script>
let events=[];const dialog=document.getElementById('detailDialog');
function eventDate(e){return new Date(e.date+'T23:59:59+09:00')}function isPast(e){return eventDate(e)<new Date()}function upcoming(){return events.filter(e=>!isPast(e)).sort((a,b)=>a.date.localeCompare(b.date))}function past(){return events.filter(isPast).sort((a,b)=>b.date.localeCompare(a.date))}
function openEvent(e){document.getElementById('mType').textContent=[e.type,e.status,e.country].filter(Boolean).join(' / ');document.getElementById('mTitle').textContent=`${e.display} ${e.city}`;document.getElementById('mMeta').innerHTML=`<b>${e.title}</b><br>${e.venue}<br>${e.detail}`;const wrap=document.getElementById('ticketButtons');wrap.innerHTML='';const tickets=[{label:'GENERAL TICKET',url:e.ticket,cls:''},{label:'FC TICKET',url:e.fcTicket,cls:'secondary'},{label:'VIP TICKET',url:e.vipTicket,cls:'vip'}].filter(t=>t.url&&t.url!=='#');if(tickets.length){tickets.forEach(t=>{const a=document.createElement('a');a.className=`ticket ${t.cls}`.trim();a.href=t.url;a.target='_blank';a.rel='noopener';a.textContent=t.label;wrap.appendChild(a)})}else{const a=document.createElement('a');a.className='ticket disabled';a.href='#';a.textContent='TICKET INFO COMING SOON';wrap.appendChild(a)}dialog.showModal()}
const grid=document.getElementById('pickupGrid');grid.innerHTML='';picks.forEach((e,i)=>grid.appendChild(card(e,i===0)))}
function renderOneMan(){
  const list=upcoming().filter(e=>e.type==='ONE MAN');
  const root=document.getElementById('oneManGrid');root.innerHTML='';
  list.forEach(e=>{
    const el=document.createElement('article');
    el.className='one-card';
    const special=e.special?`<div class="special">${e.special}</div>`:'';
    el.innerHTML=`${special}<div class="od">${e.display}</div><div class="oc">${e.city}</div><div class="ot">${e.title}</div><div class="ov">${e.venue}</div>`;
    el.onclick=()=>openEvent(e);
    root.appendChild(el);
  });
}</div><div class="tc">${e.city}</div><div class="tv">${e.venue}</div>`;el.onclick=()=>openEvent(e);root.appendChild(el)})}
function row(e){const el=document.createElement('article');el.className='schedule-row';el.innerHTML=`<div class="sd">${e.display}</div><div class="smeta">${e.dow||''}<br>${e.country||''}</div><div class="smain"><h3>${e.city} / ${e.title}${e.special?` — ${e.special}`:""}</h3><p>${e.venue} — ${e.detail}</p></div><div class="stag">${e.status||e.type}</div><div class="arrow">↗</div>`;el.onclick=()=>openEvent(e);return el}
function renderSchedule(filter='ALL'){let list=upcoming();if(filter==='ONE MAN')list=list.filter(e=>e.type==='ONE MAN');if(filter==='OVERSEAS')list=list.filter(e=>e.country&&e.country!=='JAPAN');if(filter==='FESTIVAL')list=list.filter(e=>e.type==='FESTIVAL'||e.type==='CIRCUIT');if(filter==='FC EVENT')list=list.filter(e=>e.type==='FC EVENT');const root=document.getElementById('scheduleList');root.innerHTML='';list.forEach(e=>root.appendChild(row(e)))}
function renderPast(){const root=document.getElementById('pastList');root.innerHTML='';const list=past();if(!list.length){root.innerHTML='<div class="past-empty">PAST SHOWS WILL APPEAR HERE AUTOMATICALLY.</div>';return}list.forEach(e=>root.appendChild(row(e)))}
function updateNext(){const e=upcoming()[0];if(!e){document.getElementById('nextCountdown').textContent='SEE YOU';document.getElementById('nextLabel').textContent='AT THE NEXT STAGE';return}const dt=new Date(e.date+'T00:00:00+09:00');const days=Math.ceil((dt-new Date())/86400000);document.getElementById('nextCountdown').textContent=days<=0?'TODAY':`${days} DAYS`;document.getElementById('nextLabel').textContent=`${e.display} / ${e.city}`}
document.getElementById('filters').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');renderSchedule(e.target.dataset.filter)});document.getElementById('closeBtn').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});

function bindNextLive(){
  const box=document.getElementById('nextBox');
  const e=upcoming()[0];
  if(!box||!e)return;
  box.onclick=()=>openEvent(e);
  box.onkeydown=(ev)=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openEvent(e)}};
}

async function loadEvents(){const res=await fetch(`events.json?v=${Date.now()}`,{cache:'no-store'});events=await res.json();renderSchedule();renderOneMan();renderPast();updateNext();bindNextLive()}loadEvents();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script>
</body></html>
